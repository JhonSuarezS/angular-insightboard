<div class="dashboard-container">
  <h2>Panel de Control</h2>

  <div class="cards-grid">
    <div
      class="card"
      *ngFor="let card of cards"
      [style.borderTopColor]="card.color"
    >
      <div class="icon">{{ card.icon }}</div>
      <div class="details">
        <h3>{{ card.title }}</h3>
        <p>{{ card.value }}</p>
      </div>
    </div>
  </div>
</div>
